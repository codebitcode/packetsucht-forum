<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paketsucht Forum</title>
  <link rel="icon" type="image/png" href="/Bilder/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    [hidden] { display: none !important; }

    #ambientPlayer {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      left: -10px;
      bottom: -10px;
    }

    #audioControls {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 1000;
      width: 52px;
      height: 38px;
      display: flex;
      align-items: stretch;
      overflow: hidden;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: 0 6px 18px rgba(0,0,0,.28);
    }

    #audioControls button {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      cursor: pointer;
      line-height: 1;
    }

    #audioControls button + button {
      border-left: 1px solid rgba(255,255,255,.06);
    }

    #audioPrev,
    #audioNext {
      flex: 0 0 6px !important;
      width: 6px !important;
      max-width: 6px !important;
      font-size: 5px;
      opacity: .18;
      overflow: hidden;
    }

    #audioToggle {
      flex: 1 1 auto;
      font-size: 0 !important;
    }

    #audioToggle[aria-label="Hintergrundmusik abspielen"]::before {
      content: "▶";
      font-size: 14px;
    }

    #audioToggle[aria-label="Hintergrundmusik pausieren"]::before {
      content: "⏸";
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="banner" class="banner"></div>

  <div class="container">
    <section id="overviewView">
      <h1>📦 Paketsucht Forum</h1>

      <div id="auth"></div>

      <h2>Neuen Thread erstellen</h2>
      <input id="titleInput" type="text" placeholder="Titel eingeben">
      <button onclick="createThread()">Absenden</button>

      <h2>Threads</h2>
      <div id="threads"></div>
    </section>

    <section id="threadView" hidden>
      <h1>📦 Thread</h1>
      <a id="backToOverview" href="/index.html">← Zurück</a>

      <h2 id="threadTitle">Lade...</h2>

      <div id="posts"></div>
      <div id="error"></div>

      <h3>Antwort schreiben</h3>
      <form id="postForm">
        <textarea id="content" rows="5" cols="50"></textarea>
        <br><br>
        <button type="submit">Posten</button>
        <input type="file" id="fileInput" accept="image/*">
        <br><br>
      </form>
    </section>
  </div>

  <audio id="ambientPlayer" preload="auto"></audio>
  <div id="audioControls" aria-label="Musiksteuerung">
    <button id="audioPrev" type="button" aria-label="Vorheriges Lied">◀</button>
    <button id="audioToggle" type="button">▶ Play</button>
    <button id="audioNext" type="button" aria-label="Nächstes Lied">▶</button>
  </div>

  <script src="/forum.js"></script>
  <script>
    document.getElementById('audioPrev').addEventListener('click', () => {
      const wasPlaying = !player.paused;
      loadTrack(currentTrackIndex - 1, wasPlaying);
    });

    document.getElementById('audioNext').addEventListener('click', () => {
      const wasPlaying = !player.paused;
      loadTrack(currentTrackIndex + 1, wasPlaying);
    });
  </script>
</body>

</html>
