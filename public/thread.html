<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paketsucht</title>
  <link rel="icon" type="image/png" href="/Bilder/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    [hidden] { display: none !important; }

    #ambientPlayer {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      left: -10px;
      bottom: -10px;
    }

    #audioToggle {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 1000;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: 0 6px 18px rgba(0,0,0,.28);
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="banner" class="banner"></div>

  <div class="container">
    <section id="overviewView">
      <h1>📦 Paketsucht Forum</h1>

      <div id="auth"></div>

      <h2>Neuen Thread erstellen</h2>
      <input id="titleInput" type="text" placeholder="Titel eingeben">
      <button onclick="createThread()">Absenden</button>

      <h2>Threads</h2>
      <div id="threads"></div>
    </section>

    <section id="threadView" hidden>
      <h1>📦 Thread</h1>
      <a id="backToOverview" href="/index.html">← Zurück</a>

      <h2 id="threadTitle">Lade...</h2>

      <div id="posts"></div>
      <div id="error"></div>

      <h3>Antwort schreiben</h3>
      <form id="postForm">
        <textarea id="content" rows="5" cols="50"></textarea>
        <br><br>
        <button type="submit">Posten</button>
        <input type="file" id="fileInput" accept="image/*">
        <br><br>
      </form>
    </section>
  </div>

  <video id="ambientPlayer" preload="auto" playsinline></video>
  <button id="audioToggle" type="button" hidden>▶ Play</button>

  <script src="/forum.js"></script>
</body>

</html>
