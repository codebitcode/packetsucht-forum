<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Paketsucht Forum</title>
  <link rel="icon" type="image/png" href="/Bilder/favicon.png">

  <link rel="stylesheet" href="/style.css">
  <style>
    body{min-height:100vh;padding:24px}
    .auth-container{max-width:520px;margin:40px auto;background:#15151c;padding:24px;border-radius:10px}
    .auth-title{margin:0 0 6px}
    .auth-sub{color:#9da3b4;margin:0 0 24px}
    .auth-form{display:grid;gap:12px}
    .auth-form input{margin:0}
    .auth-form button{width:100%;font-weight:700;cursor:pointer}
    .auth-links{margin-top:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    #msg{min-height:20px;margin:14px 0 0;color:#ffde59}
    #ambientPlayer{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px;bottom:-10px}
    #audioControls{position:fixed;right:16px;bottom:16px;z-index:1000;width:52px;height:38px;display:flex;align-items:stretch;overflow:hidden;border-radius:999px;border:1px solid rgba(255,255,255,.22);box-shadow:0 6px 18px rgba(0,0,0,.28)}
    #audioControls button{min-width:0;margin:0;padding:0;border:0;border-radius:0;cursor:pointer;line-height:1}
    #audioControls button+button{border-left:1px solid rgba(255,255,255,.06)}
    #audioPrev,#audioNext{flex:0 0 6px!important;width:6px!important;max-width:6px!important;font-size:5px;opacity:.18;overflow:hidden}
    #audioToggle{flex:1 1 auto;font-size:0!important}
    #audioToggle[aria-label="Hintergrundmusik abspielen"]::before{content:"▶";font-size:14px}
    #audioToggle[aria-label="Hintergrundmusik pausieren"]::before{content:"⏸";font-size:14px}
    @media(max-width:600px){body{padding:0}.auth-container{margin:0;min-height:100vh;border-radius:0;padding:22px 15px}}
  </style>
</head>
<body>
  <main class="auth-container">
    <h1 class="auth-title">📦 Paketsucht Forum</h1>
    <p class="auth-sub">Einloggen</p>

    <form id="loginForm" class="auth-form">
      <input type="text" id="username" placeholder="Username" autocomplete="username" required>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Login</button>
    </form>

    <p id="msg"></p>

    <div class="auth-links">
      <a href="/index.html">← Zurück zum Forum</a>
      <a href="/register.html">Noch keinen Account? Registrieren</a>
    </div>
  </main>

  <audio id="ambientPlayer" preload="auto"></audio>
  <div id="audioControls" aria-label="Musiksteuerung">
    <button id="audioPrev" type="button" aria-label="Vorheriges Lied">◀</button>
    <button id="audioToggle" type="button">▶ Play</button>
    <button id="audioNext" type="button" aria-label="Nächstes Lied">▶</button>
  </div>
  <script src="/device-tracker.js"></script>
  <script src="/auth-music.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const text = await res.text();
      let data = {};
      try { data = JSON.parse(text); } catch (_) {}
      document.getElementById('msg').innerText = data.message || (res.ok ? '' : text);

      if (res.ok) {
        window.location.href = '/';
      }
    });

    fetch('/api/track-page', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: location.host + location.pathname + location.search })
    }).catch(() => {});
  </script>
</body>
</html>
