<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Analytics</title>
  <link rel="icon" type="image/png" href="/Bilder/favicon.png">
  <style>
    *{box-sizing:border-box}
    body{font-family:Arial,sans-serif;background:#0d0f14;color:#f5f7fb;margin:0;padding:24px}
    .wrap{max-width:1450px;margin:auto}
    .top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}
    .back{color:#ffd21a;text-decoration:none;font-weight:700}
    h1{margin:0;font-size:32px}
    h2{margin-top:28px}
    .muted{color:#9da3b4}
    .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}
    button,select{padding:10px 13px;border-radius:9px;border:1px solid #343847;background:#171a23;color:#fff}
    button{cursor:pointer;background:#ffd21a;color:#111;font-weight:800;border:none}
    button:hover{filter:brightness(1.05)}
    label{display:flex;align-items:center;gap:7px}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0}
    .card{background:#151821;border:1px solid #2a2f3b;border-radius:14px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
    .big{font-size:30px;font-weight:900;margin-top:4px}
    .table-wrap{overflow:auto;border:1px solid #2a2f3b;border-radius:14px;background:#151821;box-shadow:0 8px 24px rgba(0,0,0,.18)}
    table{width:100%;border-collapse:collapse;min-width:1180px}
    th,td{padding:12px 13px;border-bottom:1px solid #272c37;text-align:left;vertical-align:top;font-size:14px}
    th{background:#1d222c;color:#fff;position:sticky;top:0;z-index:2;white-space:nowrap}
    tbody tr:hover{background:#1a1f29}
    .own{opacity:.6}
    .unknown{background:#211b11}
    .unknown:hover{background:#292116}
    .tag{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;margin:2px 4px 2px 0;white-space:nowrap}
    .tag-own{background:#253047;color:#c9d7ff}
    .tag-unknown{background:#8a5300;color:#fff0c2}
    .tag-user{background:#174f2c;color:#cbffd9}
    .tag-note{background:#624d00;color:#fff2a8}
    .ip{font-family:Consolas,monospace;white-space:nowrap}
    .ip-cell{min-width:205px}
    .device-info{margin-top:6px;line-height:1.35;color:#9da3b4;font-size:11px;white-space:normal;font-family:Arial,sans-serif}
    .paths{max-width:440px;min-width:300px;color:#c7cad3;word-break:break-word;line-height:1.45}
    .empty{padding:24px;text-align:center;color:#9da3b4}
    .accounts{max-width:650px}
    .note-cell{width:170px;min-width:170px;padding-left:8px;padding-right:8px}
    .note-box{display:grid;grid-template-columns:30px 118px;grid-template-areas:"remember input" ". save";gap:4px;align-items:center;justify-content:start}
    .remember-btn{grid-area:remember;width:30px;height:30px;padding:0;border-radius:8px;font-size:17px;background:#2a2e39;color:#83899a}
    .remember-btn.active{background:#ffd21a;color:#111}
    .note-input{grid-area:input;width:118px;min-width:0;padding:7px 8px;border-radius:8px;border:1px solid #343847;background:#10131a;color:#fff}
    .save-note{grid-area:save;width:118px;padding:7px 5px;border-radius:8px;white-space:nowrap;font-size:12px}
    @media(max-width:700px){body{padding:14px}.top{align-items:flex-start;flex-direction:column}h1{font-size:26px}.cards{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <a class="back" href="/admin.html">← Zurück zum Admin</a>
      <h1>📊 Admin Analytics</h1>
      <div id="status" class="muted">Lade…</div>
    </div>
  </div>

  <div class="bar">
    <label>Zeitraum
      <select id="days">
        <option value="1">1 Tag</option>
        <option value="3" selected>3 Tage</option>
        <option value="7">7 Tage</option>
        <option value="30">30 Tage</option>
      </select>
    </label>
    <button onclick="loadAnalytics()">Neu laden</button>
    <label><input type="checkbox" id="unknownOnly"> Nur unbekannte IPs</label>
  </div>

  <div class="cards">
    <div class="card"><div class="muted">Aufrufe</div><div class="big" id="events">-</div></div>
    <div class="card"><div class="muted">IP-Adressen</div><div class="big" id="ipsCount">-</div></div>
    <div class="card"><div class="muted">Unbekannte IPs</div><div class="big" id="unknownCount">-</div></div>
    <div class="card"><div class="muted">Registrierte Nutzer</div><div class="big" id="usersCount">-</div></div>
  </div>

  <h2>IP-Auswertung</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Status</th><th>IP-Adresse / Gerät</th><th>Land</th><th>Aufrufe</th><th>Erster Zugriff</th><th>Letzter Zugriff</th><th>User-IDs</th><th>Besuchte Seiten</th><th>Merken / Notiz</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <h2>Registrierte Accounts</h2>
  <div class="table-wrap accounts">
    <table style="min-width:520px">
      <thead><tr><th>ID</th><th>Username</th></tr></thead>
      <tbody id="users"></tbody>
    </table>
  </div>
</div>
<script>
let currentData=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function fmt(ts){if(!ts)return '-';return new Date(ts*1000).toLocaleString('de-CH');}
function deviceHtml(d){
  if(!d)return '<span class="muted">noch nicht erfasst</span>';
  const lines=[];
  const first=[d.os,d.browser].filter(Boolean).map(esc).join(' · ');
  const second=[d.device_type,d.language].filter(Boolean).map(esc).join(' · ');
  if(first)lines.push(first);
  if(second)lines.push(second);
  if(d.screen)lines.push('Bildschirm '+esc(d.screen));
  if(d.viewport)lines.push('Fenster '+esc(d.viewport));
  if(d.timezone)lines.push(esc(d.timezone));
  return lines.length?lines.join('<br>'):'<span class="muted">teilweise erfasst</span>';
}

async function saveIpNote(ip,note,remembered=true){
  const res=await fetch('/api/admin/ip-note',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ip,note,remembered})
  });
  if(!res.ok){
    alert('Speichern fehlgeschlagen: '+await res.text());
    return false;
  }
  return true;
}

function render(){
  if(!currentData)return;
  const onlyUnknown=document.getElementById('unknownOnly').checked;
  const rows=document.getElementById('rows');
  rows.innerHTML='';
  const list=currentData.ips.filter(x=>x.remembered||!onlyUnknown||x.unknown);

  if(!list.length){
    rows.innerHTML='<tr><td colspan="9" class="empty">Keine Einträge in diesem Zeitraum.</td></tr>';
  } else {
    list.forEach(x=>{
      const tr=document.createElement('tr');
      tr.className=x.unknown?'unknown':'own';
      const tags=[];
      tags.push(x.known_own_ip?'<span class="tag tag-own">mit dir verknüpft</span>':'<span class="tag tag-unknown">unbekannt</span>');
      if(x.registered_other)tags.push('<span class="tag tag-user">anderer Login</span>');
      if(x.remembered)tags.push('<span class="tag tag-note">★ gemerkt</span>');
      tr.innerHTML=`
        <td>${tags.join('')}</td>
        <td class="ip-cell"><div class="ip">${esc(x.ip)}</div><div class="device-info">${deviceHtml(x.device)}</div></td>
        <td>${esc(x.country)}</td>
        <td><b>${x.hits}</b></td>
        <td>${fmt(x.first_seen)}</td>
        <td>${fmt(x.last_seen)}</td>
        <td>${esc(x.user_ids.join(', ')||'-')}</td>
        <td class="paths">${x.paths.map(p=>'• '+esc(p)).join('<br>')}</td>`;

      const noteCell=document.createElement('td');
      noteCell.className='note-cell';
      const box=document.createElement('div');
      box.className='note-box';

      const remember=document.createElement('button');
      remember.type='button';
      remember.className='remember-btn'+(x.remembered?' active':'');
      remember.textContent=x.remembered?'★':'☆';
      remember.title=x.remembered?'IP nicht mehr merken':'IP merken';

      const input=document.createElement('input');
      input.type='text';
      input.className='note-input';
      input.placeholder='Notiz zur IP';
      input.maxLength=500;
      input.value=x.note||'';

      const save=document.createElement('button');
      save.type='button';
      save.className='save-note';
      save.textContent='Speichern';

      remember.addEventListener('click',async()=>{
        const ok=await saveIpNote(x.ip,input.value,!x.remembered);
        if(ok)await loadAnalytics();
      });

      save.addEventListener('click',async()=>{
        const ok=await saveIpNote(x.ip,input.value,true);
        if(ok)await loadAnalytics();
      });

      input.addEventListener('keydown',async e=>{
        if(e.key==='Enter'){
          e.preventDefault();
          const ok=await saveIpNote(x.ip,input.value,true);
          if(ok)await loadAnalytics();
        }
      });

      box.appendChild(remember);
      box.appendChild(input);
      box.appendChild(save);
      noteCell.appendChild(box);
      tr.appendChild(noteCell);
      rows.appendChild(tr);
    });
  }

  const users=document.getElementById('users');
  users.innerHTML='';
  currentData.users.forEach(u=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${u.id}</td><td>${esc(u.username)}</td>`;
    users.appendChild(tr);
  });
}

async function loadAnalytics(){
  document.getElementById('status').textContent='Lade…';
  const me=await fetch('/api/me').then(r=>r.json());
  if(!me.loggedIn||!me.isAdmin){document.getElementById('status').textContent='Kein Zugriff';return;}
  const days=document.getElementById('days').value;
  const res=await fetch('/api/admin/analytics?days='+encodeURIComponent(days));
  if(!res.ok){document.getElementById('status').textContent='Fehler: '+await res.text();return;}
  currentData=await res.json();
  document.getElementById('status').textContent='Admin: '+me.user.username+' · letzte '+currentData.days+' Tage';
  document.getElementById('events').textContent=currentData.total_events;
  document.getElementById('ipsCount').textContent=currentData.unique_ips;
  document.getElementById('unknownCount').textContent=currentData.unknown_ips;
  document.getElementById('usersCount').textContent=currentData.users.length;
  render();
}

document.getElementById('unknownOnly').addEventListener('change',render);
document.getElementById('days').addEventListener('change',loadAnalytics);
loadAnalytics();
</script>
</body>
</html>
